name: Java CI with Maven

# Workflow chạy khi có push hoặc pull request vào branch chính
on:
  push:
    branches: [ "main", "master" ] # Hỗ trợ cả 2 tên branch phổ biến
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn từ GitHub về máy ảo
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Bước 3: Chạy lệnh Maven (BẮT BUỘC có working-directory trỏ vào Bai03)
      - name: Build and Test with Maven
        run: mvn clean package
        working-directory: Bai03

      # Bước 4: Lưu file .jar sau khi build xong để làm minh chứng (Artifact)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-utils-artifact
          path: Bai03/target/*.jar


      - name: Verify Coverage with JaCoCo (Bai05)
        run: mvn clean verify
        working-directory: Bai05

      - name: Upload JaCoCo HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-bai05
          path: Bai05/target/site/jacoco/

      # Tự động review code bằng Checkstyle (Bai07)
      - name: Automated Code Review (Checkstyle)
        uses: dbelyaev/action-checkstyle@v1
        if: github.event_name == 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          workdir: Bai07

      # Bài 08: Đóng gói và lưu trữ file thực thi
      - name: Build and Package Bai08
        run: mvn clean package
        working-directory: Bai08

      - name: Upload Bai08 JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shipping-calculator-jar
          path: Bai08/target/*.jar

      # Thực thi Bài 09
      - name: Build and Test Bai09
        run: mvn clean test
        working-directory: Bai09

      # Lưu log của Bài 09 để thầy cô check
      - name: Upload Bai09 Logs
        uses: actions/upload-artifact@v4
        if: always() # Luôn upload kể cả khi test fail để xem log lỗi
        with:
          name: app-logs-bai09
          path: Bai09/logs/app.log

      # TRỌNG TÂM BÀI 10: Chạy build và test cho module Bài 10
      - name: Build and Test Bai10
        run: mvn clean package
        working-directory: Bai10

      # Bước 4: Lưu trữ sản phẩm Bài 10 (Artifact)
      - name: Upload Bai10 Artifact
        uses: actions/upload-artifact@v4
        if: always() # Luôn chạy để lấy file kể cả khi build lỗi
        with:
          name: shipping-calculator-bai10
          path: Bai10/target/*.jar